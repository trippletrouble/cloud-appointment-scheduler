<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Appointment Coordination</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label { display: block; margin-bottom: 3px; }
    input[type="text"], input[type="datetime-local"], textarea {
      width: calc(100% - 12px);
      padding: 5px;
      margin-top: 3px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea { min-height: 60px; }
    .suggestion-group { border: 1px solid #eee; padding: 10px; margin-top: 10px; margin-bottom:10px; border-radius: 4px;}
    .message { padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid transparent; }
    .success-message { background-color: #dff0d8; color: #3c763d; border-color: #d6e9c6; }
    .error-message { background-color: #f2dede; color: #a94442; border-color: #ebccd1; }
    button[type="submit"] {
      background-color: #5cb85c; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;
    }
  </style>
</head>
<body>

<div style="max-width: 700px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h1>Create Appointment Coordination</h1>

  <div th:if="${successMessage}" class="message success-message">
    <p th:text="${successMessage}">Success message here.</p>
  </div>
  <div th:if="${errorMessage}" class="message error-message">
    <p th:text="${errorMessage}">Error message here.</p>
  </div>

  <form action="#" th:action="@{/create}" th:object="${appointmentCoordination}" method="post">
    <div>
      <label for="proposerName">Your Name:</label>
      <input type="text" id="proposerName" th:field="*{proposerName}" required />
    </div>
    <div>
      <label for="title">Event Title:</label>
      <input type="text" id="title" th:field="*{title}" required />
    </div>
    <div>
      <label for="description">Event Description:</label>
      <textarea id="description" th:field="*{description}" rows="3"></textarea>
    </div>

    <h2>Time Suggestions (Provide 1 to 3)</h2>

    <div class="suggestion-group">
      <h3>Suggestion 1</h3>
      <div>
        <label for="suggestionDateTime1">Date and Time:</label>
        <input type="datetime-local" id="suggestionDateTime1" name="suggestionDateTime1"
               th:value="${appointmentCoordination.suggestions != null && !appointmentCoordination.suggestions.isEmpty() && appointmentCoordination.suggestions[0].dateTime != null ? #temporals.format(appointmentCoordination.suggestions[0].dateTime, 'yyyy-MM-dd''T''HH:mm') : ''}" />
      </div>
      <div>
        <label for="suggestionDescription1">Description (Optional):</label>
        <input type="text" id="suggestionDescription1" name="suggestionDescription1"
               th:value="${appointmentCoordination.suggestions != null && !appointmentCoordination.suggestions.isEmpty() ? appointmentCoordination.suggestions[0].description : ''}" />
      </div>
    </div>

    <div class="suggestion-group">
      <h3>Suggestion 2</h3>
      <div>
        <label for="suggestionDateTime2">Date and Time:</label>
        <input type="datetime-local" id="suggestionDateTime2" name="suggestionDateTime2"
               th:value="${appointmentCoordination.suggestions != null && appointmentCoordination.suggestions.size() > 1 && appointmentCoordination.suggestions[1].dateTime != null ? #temporals.format(appointmentCoordination.suggestions[1].dateTime, 'yyyy-MM-dd''T''HH:mm') : ''}" />
      </div>
      <div>
        <label for="suggestionDescription2">Description (Optional):</label>
        <input type="text" id="suggestionDescription2" name="suggestionDescription2"
               th:value="${appointmentCoordination.suggestions != null && appointmentCoordination.suggestions.size() > 1 ? appointmentCoordination.suggestions[1].description : ''}" />
      </div>
    </div>

    <div class="suggestion-group">
      <h3>Suggestion 3</h3>
      <div>
        <label for="suggestionDateTime3">Date and Time:</label>
        <input type="datetime-local" id="suggestionDateTime3" name="suggestionDateTime3"
               th:value="${appointmentCoordination.suggestions != null && appointmentCoordination.suggestions.size() > 2 && appointmentCoordination.suggestions[2].dateTime != null ? #temporals.format(appointmentCoordination.suggestions[2].dateTime, 'yyyy-MM-dd''T''HH:mm') : ''}" />
      </div>
      <div>
        <label for="suggestionDescription3">Description (Optional):</label>
        <input type="text" id="suggestionDescription3" name="suggestionDescription3"
               th:value="${appointmentCoordination.suggestions != null && appointmentCoordination.suggestions.size() > 2 ? appointmentCoordination.suggestions[2].description : ''}" />
      </div>
    </div>

    <div style="margin-top: 20px;">
      <button type="submit">Create Coordination</button>
    </div>
  </form>
</div>
</body>
</html>
