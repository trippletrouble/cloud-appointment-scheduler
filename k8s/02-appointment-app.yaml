apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-app
  template:
    metadata:
      labels:
        app: appointment-app
    spec:
      containers:
        - name: appointment-app-container
          image: appointment-app-img
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongodb-service:27017/appointment_db"
---

apiVersion: v1
kind: Service
metadata:
  name: appointment-app-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: appointment-app
