apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
data:
  haproxy.cfg: | 
    global
        daemon
    defaults
        mode http
        timeout connect 5s
        timeout client 50s
        timeout server 50s
    frontend http_front
        bind *:80
        stats uri /haproxy?stats
        default_backend http_back
    backend http_back
        balance roundrobin
        # Verweist auf die interne "Telefonnummer" der App-Gruppe
        server app1 appointment-app-service:8080 check
        server app2 appointment-app-service:8080 check
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy-container
          image: haproxy:latest
          ports:
            - containerPort: 80
          volumeMounts: # Lädt die Konfiguration in den Container
            - name: haproxy-config-volume
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
      volumes:
        - name: haproxy-config-volume
          configMap:
            name: haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-loadbalancer-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: haproxy
